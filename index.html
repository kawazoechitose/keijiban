<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>掲示板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="board-page">

  <!-- 文字の縁をギザギザにするフィルター -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="alias" color-interpolation-filters="sRGB"><feComponentTransfer>
      <feFuncR type="discrete" tableValues="0.0392 1"/><feFuncG type="discrete" tableValues="0.1725 1"/>
      <feFuncB type="discrete" tableValues="0.3333 1"/><feFuncA type="discrete" tableValues="0 1"/>
    </feComponentTransfer></filter>
    <filter id="alias2" color-interpolation-filters="sRGB"><feComponentTransfer>
      <feFuncR type="discrete" tableValues="0 0 0 0.753 0.753 0.753 0.753 1"/>
      <feFuncG type="discrete" tableValues="0 0 0 0.753 0.753 0.753 0.753 1"/>
      <feFuncB type="discrete" tableValues="0 0 0 0.753 0.753 0.753 0.753 1"/>
      <feFuncA type="discrete" tableValues="0 1"/>
    </feComponentTransfer></filter>
  </svg>

  <header class="head">
    <h1 id="title"><span class="hidden-text">掲示板</span></h1>
    <div class="actions">
      <!-- 掲示の申請：町の掲示板などで撮った写真を送る投稿ページへ -->
      <a class="btn" href="submit.html" style="color:inherit;text-decoration:none">掲示を申請する</a>
      <!-- 管理者としてログインしているブラウザでだけ表示される -->
      <a class="btn" id="admin-link" href="admin.html" hidden style="color:inherit;text-decoration:none">管理ページ</a>
      <!-- 管理者だけ：経過日数を足して見た目を確かめるスライダーを出す・しまう -->
      <button class="btn" id="kanri-toggle" type="button" hidden>経過日数</button>
    </div>
  </header>

  <!-- 確認用スライダー（管理者としてログインしているブラウザで、「経過日数」ボタンを押すか、アドレスの最後に #kanri を付けたときだけ出る）
       画面の下に固定して表示する -->
  <div id="admin" hidden>
    <label for="age">経過日数を足して確認（表示だけ）</label>
    <input id="age" type="range" min="0" max="1095" step="1" value="0">
    <output id="age-out">+0日</output>
  </div>

  <!-- 掲示面。画面が狭いときは、掲示面を縮めずに横へスクロールして見る -->
  <div class="board-scroll"><main id="board"></main></div>
  <p class="note" id="note" hidden></p>

  <!-- 拡大表示 -->
  <div class="scrim" id="viewer" hidden>
    <div class="sheet">
      <div class="bar"><span id="viewer-days"></span><button class="btn" data-close="viewer" type="button">閉じる</button></div>
      <canvas id="viewer-canvas"></canvas>
      <dl class="meta" id="viewer-info"></dl>
    </div>
  </div>

  <!-- Supabase の部品（読み込む順番：部品 → 設定 → 共通 → このページ） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="board.js"></script>
</body>
</html>
